# GitLab CI for Trendx — master branch
# SAST & Secret-Detection imported via top-level include (GitLab-native pattern).
# Local jobs: test-unit, test-integration.

stages:
  - security
  - test

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

# ── Unit tests (no external services) ────────────────────────────────
test-unit:
  stage: test
  image: python:3.12-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  before_script:
    - python -m pip install --upgrade pip
    - pip install -c constraints.txt -e ".[dev]"
  script:
    - pytest -m unit -ra --no-header --tb=short
  coverage: '/TOTAL.*\s+(\d+\%)$/'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ── Integration tests (PostgreSQL service) ────────────────────────────
# Exécute les 4 tests checkpoint/idempotence sur une réelle base PostgreSQL.
# Sans cela, la Phase 3 (ingestion incrémentale) n'est pas validable.
test-integration:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    POSTGRES_DB: trendx
    POSTGRES_USER: trendx_app
    POSTGRES_PASSWORD: trendx_app_pass
    PG_ADMIN_HOST: postgres
    PG_ADMIN_PORT: "5432"
    PG_ADMIN_DB: trendx
    PG_ADMIN_USER: trendx_app
    PG_ADMIN_PASSWORD: trendx_app_pass
    # catalog_dsn_app() / analytics_dsn_app() read TRENDX_APP_USER / TRENDX_APP_PASSWORD
    # (NOT TRENDX_DB_PASSWORD). Without these, the DSN defaults to 'CHANGE_ME' and every
    # integration test silently skips (fail-open). Must match POSTGRES_USER / POSTGRES_PASSWORD.
    TRENDX_APP_USER: trendx_app
    TRENDX_APP_PASSWORD: trendx_app_pass
    TRENDX_DB_NAME: trendx
    TRENDX_DB_HOST: postgres
    TRENDX_DB_PORT: "5432"
    TRENDX_DB_USER: trendx_app
    TRENDX_DB_PASSWORD: trendx_app_pass
    TRENDX_DEFAULT_TENANT_ID: df634b20-d6b0-11f0-bed9-45e34e17c7de
    TRENDX_DEFAULT_CUSTOMER_ID: 8a40b580-9b9e-11f0-8e3f-c909dc64d424
    TRENDX_DEFAULT_USER_ID: 8a513040-9b9e-11f0-8e3f-c909dc64d424
    TB_BASE_URL: http://localhost:8080
    TB_USERNAME: test@example.com
    TB_PASSWORD: test
    TB_AUTH_CONFIGURED: "false"
  before_script:
    - python -m pip install --upgrade pip
    - pip install -c constraints.txt -e ".[dev]"
    - apt-get update && apt-get install -y --no-install-recommends postgresql-client
    - |
      # Wait for PostgreSQL
      for i in $(seq 1 30); do
        pg_isready -h postgres -p 5432 && break
        sleep 1
      done
    - |
      # Create the dedicated schemas required by the migration chain (001..006).
      # Only the schemas: the tables (aggregate_watermarks, ingestion_checkpoints, …)
      # are created by the migrations themselves. Using IF NOT EXISTS keeps this idempotent.
      PGPASSWORD="$POSTGRES_PASSWORD" psql -h postgres -U trendx_app -d trendx -v ON_ERROR_STOP=1 <<'SQL'
      CREATE SCHEMA IF NOT EXISTS trendx_catalog;
      CREATE SCHEMA IF NOT EXISTS trendx_analytics;
      SQL
    - |
      # The migration chain (notably 004) expects the trendx_migration role to exist
      # (object ownership / SECURITY DEFINER functions). In a full deployment this role is
      # created by the bootstrap (migration 000), which is intentionally excluded here.
      # Create it idempotently so the chain applies on the integration job's single role.
      PGPASSWORD="$POSTGRES_PASSWORD" psql -h postgres -U trendx_app -d trendx -v ON_ERROR_STOP=1 <<'SQL'
      DO $$
      BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'trendx_migration') THEN
          CREATE ROLE trendx_migration LOGIN PASSWORD 'trendx_migration_pass';
        END IF;
      END;
      $$;
      GRANT trendx_migration TO trendx_app;
      SQL
    - |
      # Apply 001 -> 006 (P1 scope). Migration 000 is a privileged bootstrap
      # (separate databases/roles) and is excluded on purpose. Migration 007 is
      # intentionally skipped: it grants to the trendx_ro role, which is not
      # provisioned by the integration job and is outside P1 scope. Migration 008
      # (adds model_uri to prediction_model) is part of 0.3 and is NOT applied in
      # P1: it is out of scope and has a known schema defect (targets
      # trendx_catalog.prediction_model while the table lives in public). The P1
      # integration test was rewritten to validate migration 006's own artifact
      # (trendx_catalog.prediction_model_status_history) without depending on 008.
      # Each file is applied with ON_ERROR_STOP=1 and is idempotent/reentrant.
      for f in migrations/001_*.sql migrations/002_*.sql migrations/003_*.sql \
               migrations/004_*.sql migrations/005_*.sql migrations/006_*.sql; do
        [ -e "${f}" ] || continue
        echo ">>> applying ${f}"
        PGPASSWORD="$POSTGRES_PASSWORD" psql -h postgres -U trendx_app -d trendx \
            -v ON_ERROR_STOP=1 -f "${f}"
      done
    - |
      # Seed the aggregate watermark row the integration tests expect (idempotent).
      # Runs AFTER the full migration chain so the table (created by 004) already exists.
      # The worker tests read/update it. Mirrors the production bootstrap seed.
      PGPASSWORD="$POSTGRES_PASSWORD" psql -h postgres -U trendx_app -d trendx -v ON_ERROR_STOP=1 <<'SQL'
      INSERT INTO trendx_analytics.aggregate_watermarks
          (aggregate_name, last_refresh_start, last_refresh_rows)
      VALUES ('hourly', '2026-01-01T00:00:00+00:00', 0)
      ON CONFLICT (aggregate_name) DO NOTHING;
      SQL
  script:
    - pytest -m integration -ra --no-header --tb=short
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ── Migration 008 targeted DB test (issue #2) ────────────────────────
# Applies migrations 001 -> 008 on a real PostgreSQL service and proves
# public.prediction_model.model_uri exists and that 008 is idempotent.
# Runs only on MR events with --run-integration so the integration marker
# is actually executed (fail-closed: any psql/assertion error fails the job).
test-migration-008:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    POSTGRES_DB: trendx
    POSTGRES_USER: trendx_app
    POSTGRES_PASSWORD: trendx_app_pass
    PG_ADMIN_HOST: postgres
    PG_ADMIN_PORT: "5432"
    PG_ADMIN_DB: trendx
    PG_ADMIN_USER: trendx_app
    PG_ADMIN_PASSWORD: trendx_app_pass
    TRENDX_DB_NAME: trendx
    TRENDX_DB_HOST: postgres
    TRENDX_DB_PORT: "5432"
    TRENDX_DB_USER: trendx_app
    TRENDX_DB_PASSWORD: trendx_app_pass
  before_script:
    - python -m pip install --upgrade pip
    - pip install -c constraints.txt -e ".[dev]"
    - apt-get update && apt-get install -y --no-install-recommends postgresql-client
    - |
      for i in $(seq 1 30); do
        pg_isready -h postgres -p 5432 && break
        sleep 1
      done
  script:
    - pytest tests/integration/test_migration_008_model_uri.py --run-integration -ra --no-header --tb=short
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ── Migration 007 topology tables DB test ─────────────────────────────
# Applies migration 007 against a real PostgreSQL service, proves the
# three trendx_catalog topology tables exist with correct structure and
# grants, that 007 is idempotent, and that TopologyDiscoveryService.
# update_catalog() actually writes and reads back topology via the ORM.
# Runs only on MR events; the integration marker is actually executed
# (fail-closed: any psql/assertion error fails the job). 007 is applied
# in isolation (NOT 001->007) because migration 001 carries a \restrict
# artifact that is an explicit out-of-scope separate chantier.
test-migration-007:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    POSTGRES_DB: trendx
    POSTGRES_USER: trendx_app
    POSTGRES_PASSWORD: trendx_app_pass
    PG_ADMIN_HOST: postgres
    PG_ADMIN_PORT: "5432"
    PG_ADMIN_DB: trendx
    PG_ADMIN_USER: trendx_app
    PG_ADMIN_PASSWORD: trendx_app_pass
    TRENDX_DB_NAME: trendx
    TRENDX_DB_HOST: postgres
    TRENDX_DB_PORT: "5432"
    TRENDX_DB_USER: trendx_app
    TRENDX_DB_PASSWORD: trendx_app_pass
    TRENDX_APP_USER: trendx_app
    TRENDX_APP_PASSWORD: trendx_app_pass
  before_script:
    - python -m pip install --upgrade pip
    - pip install -c constraints.txt -e ".[dev]"
    - apt-get update && apt-get install -y --no-install-recommends postgresql-client
    - |
      # Wait for PostgreSQL
      for i in $(seq 1 30); do
        pg_isready -h postgres -p 5432 && break
        sleep 1
      done
    - |
      # Create the dedicated schemas required by migration 007 (idempotent).
      PGPASSWORD="$POSTGRES_PASSWORD" psql -h postgres -U trendx_app -d trendx -v ON_ERROR_STOP=1 <<'SQL'
      CREATE SCHEMA IF NOT EXISTS trendx_catalog;
      CREATE SCHEMA IF NOT EXISTS trendx_analytics;
      SQL
    - |
      # Migration 007 sets OWNER TO trendx_migration and GRANTs to trendx_app
      # and trendx_ro. Provision both roles idempotently. trendx_ro is a plain
      # read-only role (no extra privileges, no membership) required only so the
      # GRANT ... TO trendx_ro statements in 007 succeed.
      PGPASSWORD="$POSTGRES_PASSWORD" psql -h postgres -U trendx_app -d trendx -v ON_ERROR_STOP=1 <<'SQL'
      DO $$
      BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'trendx_migration') THEN
          CREATE ROLE trendx_migration LOGIN PASSWORD 'trendx_migration_pass';
        END IF;
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'trendx_ro') THEN
          CREATE ROLE trendx_ro LOGIN PASSWORD 'trendx_ro_pass';
        END IF;
      END;
      $$;
      GRANT trendx_migration TO trendx_app;
      SQL
    - |
      # Apply migration 007 in isolation. ON_ERROR_STOP makes psql fail loudly
      # on any SQL error (no || true).
      PGPASSWORD="$POSTGRES_PASSWORD" psql -h postgres -U trendx_app -d trendx \
          -v ON_ERROR_STOP=1 -f migrations/007_topology_tables.sql
  script:
    - pytest tests/integration/test_migration_007_topology.py --run-integration -ra --no-header --tb=short
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ── Migration 001 native schema DB test (issue: \restrict artefact) ───────
# Applies migration 001 against a real PostgreSQL service and proves the
# migration applies completely under ON_ERROR_STOP=1 (no masked error, no
# partial application) and that the stray \restrict/\unrestrict restricted-mode
# artefact is absent (regression guard for this chantier). 001 creates all its
# objects in the public schema with no OWNER TO / GRANT / CREATE ROLE, so it
# needs neither the trendx_catalog / trendx_analytics schemas nor the
# trendx_migration role: it runs under the single trendx_app role.
# Runs on MR events (with -m integration so the integration marker is actually
# executed, fail-closed) and on branch push (so the before/after fix can be
# validated on a real PostgreSQL without opening an MR).
# Migration 001 is NON-idempotent, so this dedicated FRESH database is the only
# valid place to run this test; it must NOT be collected by the shared
# test-integration job (excluded via the migration_apply marker there).
test-migration-001:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    POSTGRES_DB: trendx
    POSTGRES_USER: trendx_app
    POSTGRES_PASSWORD: trendx_app_pass
    PG_ADMIN_HOST: postgres
    PG_ADMIN_PORT: "5432"
    PG_ADMIN_DB: trendx
    PG_ADMIN_USER: trendx_app
    PG_ADMIN_PASSWORD: trendx_app_pass
    TRENDX_DB_NAME: trendx
    TRENDX_DB_HOST: postgres
    TRENDX_DB_PORT: "5432"
    TRENDX_DB_USER: trendx_app
    TRENDX_DB_PASSWORD: trendx_app_pass
    TRENDX_APP_USER: trendx_app
    TRENDX_APP_PASSWORD: trendx_app_pass
  before_script:
    - python -m pip install --upgrade pip
    - pip install -c constraints.txt -e ".[dev]"
    - apt-get update && apt-get install -y --no-install-recommends postgresql-client
    - |
      # Wait for PostgreSQL
      for i in $(seq 1 30); do
        pg_isready -h postgres -p 5432 && break
        sleep 1
      done
  script:
    # -m integration is REQUIRED (see test-migration-008 above): without it the
    # integration-marked test is skipped by conftest.py and the job runs nothing.
    - pytest tests/integration/test_migration_001_native_schema.py -m integration --run-integration -ra --no-header --tb=short
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
