# GitLab CI for Trendx — master branch
# SAST & Secret-Detection imported via top-level include (GitLab-native pattern).
# Local jobs: test-unit, test-integration.

stages:
  - security
  - test

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

# ── Unit tests (no external services) ────────────────────────────────
test-unit:
  stage: test
  image: python:3.12-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  before_script:
    - python -m pip install --upgrade pip
    - pip install -c constraints.txt -e ".[dev]"
  script:
    - pytest -m unit -ra --no-header --tb=short
  coverage: '/TOTAL.*\s+(\d+\%)$/'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ── Integration tests (PostgreSQL service) ────────────────────────────
# Exécute les 4 tests checkpoint/idempotence sur une réelle base PostgreSQL.
# Sans cela, la Phase 3 (ingestion incrémentale) n'est pas validable.
test-integration:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    POSTGRES_DB: trendx
    POSTGRES_USER: trendx_app
    POSTGRES_PASSWORD: trendx_app_pass
    PG_ADMIN_HOST: postgres
    PG_ADMIN_PORT: "5432"
    PG_ADMIN_DB: trendx
    PG_ADMIN_USER: trendx_app
    PG_ADMIN_PASSWORD: trendx_app_pass
    # catalog_dsn_app() / analytics_dsn_app() read TRENDX_APP_USER / TRENDX_APP_PASSWORD
    # (NOT TRENDX_DB_PASSWORD). Without these, the DSN defaults to 'CHANGE_ME' and every
    # integration test silently skips (fail-open). Must match POSTGRES_USER / POSTGRES_PASSWORD.
    TRENDX_APP_USER: trendx_app
    TRENDX_APP_PASSWORD: trendx_app_pass
    TRENDX_DB_NAME: trendx
    TRENDX_DB_HOST: postgres
    TRENDX_DB_PORT: "5432"
    TRENDX_DB_USER: trendx_app
    TRENDX_DB_PASSWORD: trendx_app_pass
    TRENDX_DEFAULT_TENANT_ID: df634b20-d6b0-11f0-bed9-45e34e17c7de
    TRENDX_DEFAULT_CUSTOMER_ID: 8a40b580-9b9e-11f0-8e3f-c909dc64d424
    TRENDX_DEFAULT_USER_ID: 8a513040-9b9e-11f0-8e3f-c909dc64d424
    TB_BASE_URL: http://localhost:8080
    TB_USERNAME: test@example.com
    TB_PASSWORD: test
    TB_AUTH_CONFIGURED: "false"
  before_script:
    - python -m pip install --upgrade pip
    - pip install -c constraints.txt -e ".[dev]"
    - apt-get update && apt-get install -y --no-install-recommends postgresql-client
    - |
      # Wait for PostgreSQL
      for i in $(seq 1 30); do
        pg_isready -h postgres -p 5432 && break
        sleep 1
      done
    - |
      # Create the dedicated schemas required by the migration chain (001..006).
      # Only the schemas: the tables (aggregate_watermarks, ingestion_checkpoints, …)
      # are created by the migrations themselves. Using IF NOT EXISTS keeps this idempotent.
      PGPASSWORD="$POSTGRES_PASSWORD" psql -h postgres -U trendx_app -d trendx -v ON_ERROR_STOP=1 <<'SQL'
      CREATE SCHEMA IF NOT EXISTS trendx_catalog;
      CREATE SCHEMA IF NOT EXISTS trendx_analytics;
      SQL
    - |
      # Roles required by the canonical chain (000 grants to them; 007 sets
      # OWNER trendx_migration and GRANTs to trendx_ro). They are NOLOGIN
      # placeholder roles for the ephemeral CI database only — no password, so no
      # secret is ever committed. In production these roles are created by the
      # infrastructure bootstrap, not here.
      PGPASSWORD="$POSTGRES_PASSWORD" psql -h postgres -U trendx_app -d trendx -v ON_ERROR_STOP=1 <<'SQL'
      DO $$
      BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'trendx_migration') THEN
          CREATE ROLE trendx_migration NOLOGIN;
        END IF;
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'trendx_grafana') THEN
          CREATE ROLE trendx_grafana NOLOGIN;
        END IF;
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'trendx_ro') THEN
          CREATE ROLE trendx_ro NOLOGIN;
        END IF;
      END;
      $$;
      GRANT trendx_migration TO trendx_app;
      SQL
    - |
      # Canonical migration chain 000 -> 012 applied by the single runner.
      # Replaces the previous hard-coded per-file loop: the runner is now the ONLY
      # execution path. It discovers migrations/migrations/NNN_*.sql in numeric
      # order, applies each atomically (psql -1, or ON_ERROR_STOP=1 for migrations
      # that manage their own transaction), traces public.schema_version, and
      # refuses to write without TRENDX_CONFIRM_APPLY (set explicitly below — not a
      # secret). This integrates 008 and 012 into the canonical chain.
      export PGPASSWORD="$POSTGRES_PASSWORD"
      PGHOST=postgres PGPORT=5432 PGUSER=trendx_app PGDATABASE=trendx TRENDX_CONFIRM_APPLY=YES \
        bash scripts/apply-migrations.sh --apply
    - |
      # Seed the aggregate watermark row the integration tests expect (idempotent).
      # Runs AFTER the full migration chain so the table (created by 004) already exists.
      # The worker tests read/update it. Mirrors the production bootstrap seed.
      PGPASSWORD="$POSTGRES_PASSWORD" psql -h postgres -U trendx_app -d trendx -v ON_ERROR_STOP=1 <<'SQL'
      INSERT INTO trendx_analytics.aggregate_watermarks
          (aggregate_name, last_refresh_start, last_refresh_rows)
      VALUES ('hourly', '2026-01-01T00:00:00+00:00', 0)
      ON CONFLICT (aggregate_name) DO NOTHING;
      SQL
  script:
    # The migration-apply tests (001, 008) each re-run migration 001, which is
    # NON-idempotent (plain CREATE TABLE / FUNCTION / INDEX, no IF NOT EXISTS).
    # They can only run on a FRESH database provided by their own dedicated jobs,
    # so they are excluded here via the migration_apply marker. Collecting them
    # in this shared job (where 001->006 is already applied in before_script)
    # would make psql fail with ON_ERROR_STOP on the first re-created object.
    - pytest -m "integration and not migration_apply" -ra --no-header --tb=short
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ── Migration 008 targeted DB test (issue #2) ────────────────────────
# Applies migrations 001 -> 008 on a real PostgreSQL service and proves
# trendx_catalog.prediction_model.model_uri exists and that 008 is idempotent.
# Runs only on MR events with --run-integration so the integration marker
# is actually executed (fail-closed: any psql/assertion error fails the job).
test-migration-008:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    POSTGRES_DB: trendx
    POSTGRES_USER: trendx_app
    POSTGRES_PASSWORD: trendx_app_pass
    PG_ADMIN_HOST: postgres
    PG_ADMIN_PORT: "5432"
    PG_ADMIN_DB: trendx
    PG_ADMIN_USER: trendx_app
    PG_ADMIN_PASSWORD: trendx_app_pass
    TRENDX_DB_NAME: trendx
    TRENDX_DB_HOST: postgres
    TRENDX_DB_PORT: "5432"
    TRENDX_DB_USER: trendx_app
    TRENDX_DB_PASSWORD: trendx_app_pass
    # catalog_dsn_app()/analytics_dsn_app() read TRENDX_APP_USER/TRENDX_APP_PASSWORD
    # (NOT TRENDX_DB_PASSWORD). Without these, the 'catalog' engine authenticates
    # with the default CHANGE_ME password and the job fails at conftest._db_available()
    # (FATAL: password authentication failed for user "trendx_app"). Mirrors the
    # test-migration-001 job, which defines these and succeeds.
    TRENDX_APP_USER: trendx_app
    TRENDX_APP_PASSWORD: trendx_app_pass
  before_script:
    - python -m pip install --upgrade pip
    - pip install -c constraints.txt -e ".[dev]"
    - apt-get update && apt-get install -y --no-install-recommends postgresql-client
    - |
      for i in $(seq 1 30); do
        pg_isready -h postgres -p 5432 && break
        sleep 1
      done
  script:
    # -m integration is REQUIRED: without it conftest.py skips integration-marked
    # tests (fail-open), so the job would go green while running zero tests.
    - pytest tests/integration/test_migration_008_model_uri.py -m integration --run-integration -ra --no-header --tb=short
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ── Migration 007 topology tables DB test ─────────────────────────────
# Applies migration 007 against a real PostgreSQL service, proves the
# three trendx_catalog topology tables exist with correct structure and
# grants, that 007 is idempotent, and that TopologyDiscoveryService.
# update_catalog() actually writes and reads back topology via the ORM.
# Runs only on MR events; the integration marker is actually executed
# (fail-closed: any psql/assertion error fails the job). 007 is applied
# in isolation (NOT 001->007) because migration 001 carries a \restrict
# artifact that is an explicit out-of-scope separate chantier.
test-migration-007:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    POSTGRES_DB: trendx
    POSTGRES_USER: trendx_app
    POSTGRES_PASSWORD: trendx_app_pass
    PG_ADMIN_HOST: postgres
    PG_ADMIN_PORT: "5432"
    PG_ADMIN_DB: trendx
    PG_ADMIN_USER: trendx_app
    PG_ADMIN_PASSWORD: trendx_app_pass
    TRENDX_DB_NAME: trendx
    TRENDX_DB_HOST: postgres
    TRENDX_DB_PORT: "5432"
    TRENDX_DB_USER: trendx_app
    TRENDX_DB_PASSWORD: trendx_app_pass
    TRENDX_APP_USER: trendx_app
    TRENDX_APP_PASSWORD: trendx_app_pass
  before_script:
    - python -m pip install --upgrade pip
    - pip install -c constraints.txt -e ".[dev]"
    - apt-get update && apt-get install -y --no-install-recommends postgresql-client
    - |
      # Wait for PostgreSQL
      for i in $(seq 1 30); do
        pg_isready -h postgres -p 5432 && break
        sleep 1
      done
    - |
      # Create the dedicated schemas required by migration 007 (idempotent).
      PGPASSWORD="$POSTGRES_PASSWORD" psql -h postgres -U trendx_app -d trendx -v ON_ERROR_STOP=1 <<'SQL'
      CREATE SCHEMA IF NOT EXISTS trendx_catalog;
      CREATE SCHEMA IF NOT EXISTS trendx_analytics;
      SQL
    - |
      # Migration 007 sets OWNER TO trendx_migration and GRANTs to trendx_app
      # and trendx_ro. Provision both roles idempotently. trendx_ro is a plain
      # read-only role (no extra privileges, no membership) required only so the
      # GRANT ... TO trendx_ro statements in 007 succeed.
      PGPASSWORD="$POSTGRES_PASSWORD" psql -h postgres -U trendx_app -d trendx -v ON_ERROR_STOP=1 <<'SQL'
      DO $$
      BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'trendx_migration') THEN
          CREATE ROLE trendx_migration NOLOGIN;
        END IF;
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'trendx_ro') THEN
          CREATE ROLE trendx_ro NOLOGIN;
        END IF;
      END;
      $$;
      GRANT trendx_migration TO trendx_app;
      SQL
    - |
      # Apply migration 007 in isolation. ON_ERROR_STOP makes psql fail loudly
      # on any SQL error (no || true).
      PGPASSWORD="$POSTGRES_PASSWORD" psql -h postgres -U trendx_app -d trendx \
          -v ON_ERROR_STOP=1 -f migrations/007_topology_tables.sql
  script:
    - pytest tests/integration/test_migration_007_topology.py -m integration --run-integration -ra --no-header --tb=short
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ── Migration 001 native schema DB test (issue: \restrict artefact) ───────
# Applies migration 001 against a real PostgreSQL service and proves the
# migration applies completely under ON_ERROR_STOP=1 (no masked error, no
# partial application) and that the stray \restrict/\unrestrict restricted-mode
# artefact is absent (regression guard for this chantier). 001 creates all its
# objects in the trendx_catalog schema (Bounded Context) with no OWNER TO /
# GRANT / CREATE ROLE, so it needs neither the trendx_analytics schema nor the
# trendx_migration role: it runs under the single trendx_app role. The
# trendx_catalog schema is created by 001 itself (no ad-hoc CI bootstrap).
# Runs on MR events (with -m integration so the integration marker is actually
# executed, fail-closed) and on branch push (so the before/after fix can be
# validated on a real PostgreSQL without opening an MR).
# Migration 001 is NON-idempotent, so this dedicated FRESH database is the only
# valid place to run this test; it must NOT be collected by the shared
# test-integration job (excluded via the migration_apply marker there).
test-migration-001:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    POSTGRES_DB: trendx
    POSTGRES_USER: trendx_app
    POSTGRES_PASSWORD: trendx_app_pass
    PG_ADMIN_HOST: postgres
    PG_ADMIN_PORT: "5432"
    PG_ADMIN_DB: trendx
    PG_ADMIN_USER: trendx_app
    PG_ADMIN_PASSWORD: trendx_app_pass
    TRENDX_DB_NAME: trendx
    TRENDX_DB_HOST: postgres
    TRENDX_DB_PORT: "5432"
    TRENDX_DB_USER: trendx_app
    TRENDX_DB_PASSWORD: trendx_app_pass
    TRENDX_APP_USER: trendx_app
    TRENDX_APP_PASSWORD: trendx_app_pass
  before_script:
    - python -m pip install --upgrade pip
    - pip install -c constraints.txt -e ".[dev]"
    - apt-get update && apt-get install -y --no-install-recommends postgresql-client
    - |
      # Wait for PostgreSQL
      for i in $(seq 1 30); do
        pg_isready -h postgres -p 5432 && break
        sleep 1
      done
  script:
    # -m integration is REQUIRED (see test-migration-008 above): without it the
    # integration-marked test is skipped by conftest.py and the job runs nothing.
    - pytest tests/integration/test_migration_001_native_schema.py -m integration --run-integration -ra --no-header --tb=short
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'

# ── Canonical runner + 000/002 migration tests (disposable PostgreSQL) ──────
# Runs the canonical runner end-to-end (000 -> 012) and the 000/002 migration
# tests against the real PostgreSQL service (no Docker-in-Docker needed):
# TRENDX_TEST_PG* point the fixtures at this service. The real infra roles are
# provisioned idempotently (NOLOGIN, no password) so 000 grants and 007
# OWNER/GRANT succeed. No secret is committed (roles have no password).
test-canonical-runner:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    POSTGRES_DB: trendx
    POSTGRES_USER: trendx_app
    POSTGRES_PASSWORD: trendx_app_pass
    TRENDX_TEST_PGHOST: postgres
    TRENDX_TEST_PGPORT: "5432"
    TRENDX_TEST_PGUSER: trendx_app
    TRENDX_TEST_PGPASSWORD: trendx_app_pass
    TRENDX_TEST_PGDATABASE: trendx
    TRENDX_APP_USER: trendx_app
    TRENDX_APP_PASSWORD: trendx_app_pass
  before_script:
    - python -m pip install --upgrade pip
    - pip install -c constraints.txt -e ".[dev]"
    - apt-get update && apt-get install -y --no-install-recommends postgresql-client
    - |
      for i in $(seq 1 30); do
        pg_isready -h postgres -p 5432 && break
        sleep 1
      done
    - |
      # Provision the real infra roles (NOLOGIN placeholders, no secret) so the
      # canonical chain (000 grants, 007 OWNER/GRANT) applies cleanly. trendx_app
      # is the service superuser (POSTGRES_USER); the others are created idempotently.
      PGPASSWORD="$POSTGRES_PASSWORD" psql -h postgres -U trendx_app -d trendx -v ON_ERROR_STOP=1 <<'SQL'
      DO $$
      BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'trendx_migration') THEN
          CREATE ROLE trendx_migration NOLOGIN;
        END IF;
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'trendx_grafana') THEN
          CREATE ROLE trendx_grafana NOLOGIN;
        END IF;
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'trendx_ro') THEN
          CREATE ROLE trendx_ro NOLOGIN;
        END IF;
      END;
      $$;
      SQL
  script:
    # -m integration is REQUIRED so conftest.py does not skip the integration-marked
    # tests (fail-open guard). The fixtures use TRENDX_TEST_PG* (this service).
    - pytest tests/integration/test_runner_apply_migrations.py tests/integration/test_migration_000_schema_bootstrap.py tests/integration/test_migration_002_analytics_schema.py -m integration --run-integration -ra --no-header --tb=short
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
