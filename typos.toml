# typos configuration for Trendx — SOURCE UNIQUE du contrôle orthographique.
# https://github.com/crate-ci/typos#configuration-file
#
# W118 (I-04) : ce fichier est le SEUL endroit où vit le glossaire français et
# les ignorances typos. Le hook pre-commit, la CI et toute invocation manuelle
# pointent ici (`typos --config typos.toml`) ; une invocation nue `typos` lit
# automatiquement ce même fichier. Aucune règle typos n'est dupliquée dans
# pyproject.toml : une configuration éclatée rendait le glossaire français
# mort pour l'invocation par défaut (constaté : 1605 signalements sur les
# fichiers suivis avec `typos` nu, 0 avec `--config pyproject.toml`).
#
# Détail des ignorances : voir docs/w118-certification-infrastructure-hardening.md.

[default]
# Faux positifs typos sur fragments hex des batchs d'ingestion synthétiques
# (docs/train-synthetic-exclusion.md, tests/unit/test_training_synthetic_exclusion.py) :
# typos découpe "8e88d1ba-0e0" et "e6c0b750-6ba" et signale le fragment "ba".
# Identifiants exacts ancrés uniquement — aucun mot anglais réel n'est ignoré
# (vérifié : "teh" reste détecté). Ne pas élargir sans gate dédiée.
extend-ignore-identifiers-re = ["^8e88d1ba$", "^6ba$"]
# "mobili_dahsboard-postgres-1" container hostname and
# "mobili_dahsboard_default" Docker network name are intentional and
# deployed — correcting them would break PostgreSQL connectivity.
extend-ignore-words-re = [
    "dahsboard",
]

[default.extend-words]
MAPE = "MAPE"
