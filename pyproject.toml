[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trendx"
version = "0.1.0"
description = "Plateforme d'analyse de tendances et de traitement de données"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [
  { name = "Trendx Team", email = "dev@trendx.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.110,<0.111",
  "uvicorn[standard]>=0.29,<0.30",
  "starlette>=0.36,<0.37",
  "sqlalchemy>=2.0,<2.1",
  "psycopg2-binary>=2.9,<2.10",
  "redis>=5.0,<5.1",
  "celery>=5.3,<5.4",
  "pydantic>=2.6,<2.7",
  "pydantic-settings>=2.2,<2.3",
  "python-dotenv>=1.0,<1.1",
  "httpx>=0.27,<0.28",
  "loguru>=0.7,<0.8",
  "pendulum>=3.0,<3.1",
  "python-dateutil>=2.9,<3.0",
  "tenacity>=8.2,<8.3",
  "orjson>=3.10,<3.11",
  "numpy>=1.26,<2",
  "pandas>=2.2,<2.3",
  "scipy>=1.12,<1.13",
  "scikit-learn>=1.4,<1.5",
  "statsmodels>=0.14,<0.15",
  "prophet>=1.1,<1.2",
  "pmdarima>=2.0,<2.1",
  "pyod>=1.1,<1.2",
  "mlflow>=2.14,<2.15",
  "setuptools>=68.0,<81.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "pytest-mock>=3.14",
  "ruff>=0.3",
  "mypy>=1.9",
  "pre-commit>=3.7",
  "faker>=24.0",
  "factory-boy>=3.3",
  "httpx>=0.27",
]

[project.scripts]
trendx = "trendx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "FBT", "Q", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --cov=src --cov-report=term-missing"
markers = [
  "slow: tests qui prennent du temps",
  "integration: tests d'intégration nécessitant des services externes",
  "unit: tests unitaires",
]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
ignore_missing_imports = true
explicit_package_bases = true
