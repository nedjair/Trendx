apiVersion: 1

datasources:
  - name: Trendx-TimescaleDB-Analytics
    uid: trendx-tsdb-analytics
    type: postgres
    access: proxy
    url: ${TRENDX_TSDB_HOST}:${TRENDX_TSDB_PORT:-5432}
    database: trendx_analytics
    user: ${TRENDX_TSDB_USER:-trendx_app}
    secureJsonData:
      password: ${TRENDX_TSDB_PASSWORD}
    jsonData:
      postgresVersion: 1600
      sslmode: disable
      timescaledb: true
      maxOpenConns: 20
      maxIdleConns: 5
      connMaxLifetime: 14400
      queryTimeout: 300s
      tlsAuth: false
      tlsAuthWithCACert: false
    isDefault: true
    version: 1
    editable: false

  - name: Trendx-Catalog
    uid: trendx-catalog
    type: postgres
    access: proxy
    url: ${TRENDX_TSDB_HOST}:${TRENDX_TSDB_PORT:-5432}
    database: trendx
    user: ${TRENDX_TSDB_USER:-trendx_app}
    secureJsonData:
      password: ${TRENDX_TSDB_PASSWORD}
    jsonData:
      postgresVersion: 1600
      sslmode: disable
      timescaledb: false
      maxOpenConns: 10
      maxIdleConns: 3
      queryTimeout: 120s
      tlsAuth: false
      tlsAuthWithCACert: false
    isDefault: false
    version: 1
    editable: false
