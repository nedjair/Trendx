apiVersion: 1

datasources:
  - name: Trendx TimescaleDB
    uid: trendx-timescaledb
    type: postgres
    access: proxy
    url: timescaledb:5432
    database: trendx_analytics
    user: trendx_app
    secureJsonData:
      password: ${TRENDX_TSDB_PASSWORD}
    jsonData:
      postgresVersion: 1600
      sslmode: disable
      timescaledb: true
      maxOpenConns: 20
      maxIdleConns: 5
      connMaxLifetime: 14400
      queryTimeout: 300s
      tlsAuth: false
      tlsAuthWithCACert: false
    withCredentials: false
    isDefault: false
    version: 1
    editable: false
